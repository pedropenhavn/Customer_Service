[PHP]
date.timezone = "America/Sao_Paulo"      ; Define o fuso horário para sua localização
memory_limit = 512M                      ; Limite de memória alto para desenvolvimento
upload_max_filesize = 20M                ; Tamanho máximo de upload de arquivos adequado para desenvolvimento
post_max_size = 20M                      ; Tamanho máximo de dados de POST
session.save_path = "/tmp"               ; Caminho para salvar sessões, /tmp é adequado para desenvolvimento
display_errors = On                      ; Exibe erros, útil para depuração
error_reporting = E_ALL                  ; Relata todos os erros, avisos e notificações, ideal para desenvolvimento

[opcache]
opcache.validate_timestamps = 1          ; Permite a validação de timestamps dos arquivos, adequado para desenvolvimento
opcache.memory_consumption = 128         ; Quantidade de memória compartilhada para o cache de scripts, adequada para desenvolvimento
opcache.max_accelerated_files = 4000     ; Número máximo de arquivos em cache, mais do que suficiente para desenvolvimento
opcache.revalidate_freq = 2              ; Frequência de revalidação dos arquivos, baixa para garantir atualizações rápidas em desenvolvimento

[xDebug]
zend_extension=xdebug                    ; Carrega a extensão Xdebug
xdebug.mode=debug                        ; Ativa o modo de depuração
xdebug.client_port=9003                  ; Porta do cliente Xdebug, padrão para muitos ambientes de desenvolvimento
xdebug.start_with_request=yes            ; Inicia a depuração automaticamente com cada solicitação, útil para desenvolvimento
xdebug.client_host=host.docker.internal  ; Host do cliente Xdebug, configurado para ambientes Docker no Windows/Mac
xdebug.max_nesting_level=250             ; Nível máximo de aninhamento de funções, alto para desenvolvimento
xdebug.idekey=DOCKER                     ; Chave IDE para identificar as sessões de depuração
xdebug.force_display_errors=On           ; Força a exibição de erros, útil para depuração
xdebug.force_error_reporting=E_ALL       ; Relata todos os erros, avisos e notificações, ideal para desenvolvimento
