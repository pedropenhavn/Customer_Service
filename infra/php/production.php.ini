[PHP]
variables_order = "GPCS"                 ; Apenas GPCS é necessário para produção
request_order = "EGPCS"                  ; Define a ordem que as variáveis serão registradas e acessadas: Environment, GET, POST, Cookie, Server
date.timezone = "America/Sao_Paulo"      ; Defina o fuso horário para sua localização
memory_limit = 4G                        ; Aumentar o limite de memória para aproveitar a RAM disponível
upload_max_filesize = 100M               ; Tamanho máximo de upload de arquivos adequado para produção
post_max_size = 100M                     ; Tamanho máximo de dados de POST
session.save_path = "/var/lib/php/sessions" ; Caminho seguro para salvar sessões
display_errors = Off                     ; Não exibe erros, útil para segurança
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE ; Relata apenas erros importantes
max_execution_time = 60                  ; Tempo de execução mais restrito para evitar loops infinitos
max_input_time = 60
max_input_vars = 1000                    ; Limite menor para variáveis de entrada

[opcache]
opcache.enable = 1                       ; Habilita o cache
opcache.validate_timestamps = 0          ; Desativa a validação de timestamps para performance
opcache.memory_consumption = 1024        ; Usar 1 GB para o cache de scripts
opcache.max_accelerated_files = 40000    ; Número maior de arquivos em cache
opcache.revalidate_freq = 0              ; Não revalida arquivos para máxima performance
opcache.save_comments = 0                ; Desativa comentários em scripts compilados para economia de memória
opcache.fast_shutdown = 1                ; Habilita o encerramento rápido do PHP
opcache.enable_cli = 1                   ; Habilita o opcache também para a CLI, útil para comandos Artisan do Laravel

[swoole]
swoole.use_shortname = 'Off'             ; Desativa shortname para evitar conflitos com outros pacotes PHP
swoole.enable_coroutine = 'On'           ; Habilita coroutines para melhor performance com Swoole
