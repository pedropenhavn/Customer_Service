services:
    app:
        hostname: base
        container_name: app-base
        image: base:${APP_ENV:-local}
        build:
            context: ./infra/
            dockerfile: docker/Dockerfile
            args:
                - app_env=${APP_ENV:-local}
                - user=${DEPLOY_USER:-www-data}
                - uid=${DEPLOY_UID:-1000}
        volumes:
            - ./:/var/www/
        working_dir: /var/www/
        restart: unless-stopped
        ports:
            - "8899:8000"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - base
        depends_on:
            - redis

    nginx:
        hostname: nginx
        container_name: nginx-base
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./infra/nginx/sites-enabled:/etc/nginx/sites-enabled:ro
            - ./frontend/build:/var/www/frontend:ro
            - ./public:/var/www/public:ro
        networks:
            - base
        depends_on:
            - app

    redis:
        container_name: redis-base
        image: redis:latest
        hostname: redis-producers
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - base
networks:
    base:
        name: base


